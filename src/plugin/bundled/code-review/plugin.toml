# thurbox's code review, as a plugin — the whole document the native view lists.
#
# The fourth pane of Phase 4, and the one ported in two steps. What it draws is the
# review's **document**: file headers (rule, fold chevron, status letter, counts,
# reviewed mark), hunk headers (`@@` ranges, heading, mark), the unified diff lines
# (gutter, syntax-coloured body, row tint), comments with their classification
# badges, the review summary's heading and comments, and informational rows.
#
# What it does not reach is the review's **behaviour**, and every entry needs a host
# power this surface does not have: toggling a reviewed mark or composing a comment
# is a write to records no capability names; retargeting the diff runs `git`; the
# find sub-mode and every navigation key move a cursor the kernel owns; and the
# side-by-side, wrap and horizontal-scroll layouts need a resolved width a view tree
# does not carry — which is also why an over-long header clips here where the native
# row writes an ellipsis. The split, entry by entry, is in the change's proposal and
# `docs/PHASE4-PANE-READINESS.md` §11; the blockers are gated by
# `tests/code_review_pane_handover_gap.rs`.
#
# The syntax highlighter is **this plugin's own**, in Luau, and so are the glyphs.
# The host publishes a line's text and a file's status as a name, never a colouring
# and never a marker: how a diff reads is a pane's decision, and a plugin arranging
# runs the kernel had already coloured would prove nothing. The one exception is the
# summary heading's label, which names a thurbox keystroke a plugin pane never
# receives.
#
# Two capabilities, and that is the whole reach: it renders, and it reads the review
# the user already opened. `review` grants no git — no diff of its choosing, no
# revision, no file, no command.
name = "code-review"
api_version = 1

capabilities = ["render", "review"]

[[panes]]
id = "diff"
title = "Review (plugin)"
slot = "right"
# Off by default. The native review is still what F7 opens, so shipping this
# visible would put a second diff on screen for every user. Turn it on to compare
# them — side by side the plugin's copy is narrower, since a plugin pane is seated
# only in the right column while the native review owns the centre.
default_visible = false
