# The first bundled plugin: proof the contract works end to end, and the
# worked example a plugin author copies. Deliberately tiny — it exercises every
# node kind and both style paths without needing any host power beyond drawing.
name = "hello"
api_version = 1
capabilities = ["render"]

[[panes]]
id = "hello"
title = "Hello"
slot = "right"
# Off by default. The seed defaults to *visible*, which is right for a plugin an
# author installed on purpose and wrong for one that arrives inside the binary:
# since the host joined the default feature set (ADR-40) an omitted seed would
# open a demo pane in every fresh install's right column. `F10` shows it.
default_visible = false
