# thurbox's automations pane.
#
# Not a reproduction any more: `src/ui/automations_panel.rs` is deleted and this is the
# pane (ADR-56). It is the third of thurbox's own panes the kernel does not draw, and
# the first that is on screen **without being asked for** — the native band always was,
# and a handover changes which code draws a pane, not whether the pane is on screen.
#
# `tests/bundled_automations_panel.rs` still holds it to the native pane's tree: the
# thirteen checked-in recordings under `tests/snapshots/` were generated from
# `ui::automations_panel::automations_tree` while it existed, so they are a statement
# about the pane rather than about this file. One edge of that oracle is *not* a
# recording and survives the deletion — the row summary is compared against
# `ui::automations_list_modal::row_summary`, which the `Ctrl+P` list modal still
# composes, over all 192 combinations of schedule, action, enabled and countdown.
#
# **This pane used to hold keys, and gave them up.** The port (ADR-41) declared `input`
# and `automations-write` and five bindings of its own; it reached five of the pane's
# seven keys and could never reach the other two — `n` creates a record, which the write
# seam has no operation for by construction (ADR-35), and `Enter`/`e` opens a
# central-pane editor, which is text authoring `automations-write` is defined to exclude,
# into a focus a plugin cannot take. It also lost the editor and the run history
# outright, because `App::render_central_pane` follows a *focus*.
#
# So the handover took the other route (ADR-51): `key_context = "Automations"` means *I
# am thurbox's automations pane*, and all seven scoped actions resolve while this pane
# holds focus, performed by the kernel against its own state — the cursor `j`/`k` move
# (including its wrap into the session list), the flag `Space` toggles, the run `r`
# requests, the row `d` deletes, the record `n` creates, the editor `Enter`/`e` opens.
# Still rebindable in F1, and this plugin never sees a key.
#
# The result is the finding rather than the cost: the pane that looked like it needed the
# widest grants needs the fewest. Two capabilities, and that is the whole reach — it
# renders, and it reads the automations thurbox has scheduled. Answering a key needs no
# capability at all, because the kernel performs the action.
name = "automations"
api_version = 1

capabilities = ["render", "automations"]

[[panes]]
id = "automations"
# The native pane's title, not "Automations (plugin)": a name that marks the pane as a
# plugin is right for a copy drawn beside the original and wrong for the pane.
title = "Automations"
# The seat the native pane occupied: the band beneath the session list, whose height the
# kernel grows with the row count this pane's tree stacks (ADR-46).
slot = "left-bottom"
# The switch that always gated the automations pane. Off, this is not a pane: not shown,
# no seat, not rendered — and the user's stored visibility survives, so turning it back
# on restores what they had. It still gates the TUI's *firing* of schedules and the
# `Ctrl+P` surface, neither of which is this pane.
feature = "automations"
# thurbox's automations keyboard (ADR-51). See the header: seven actions, none of them
# this plugin's.
key_context = "Automations"
# **Visible**, unlike every other bundled pane, because the band it replaces was always
# on screen while `[features] automations` was on. There is no `toggle_action` for the
# same reason: the native pane had no toggle, so there is no key whose meaning this pane
# would be taking over.
#
# The host starts detached and a pane does not exist until it publishes, so the band
# arrives a moment after the first frame and the left column is the session list alone
# until then. That is the accepted cost (ADR-56): carving the seat from the feature flag
# instead would leave a blank band whenever the pane is absent for any other reason, and
# the first frame must never wait for a VM.
default_visible = true
