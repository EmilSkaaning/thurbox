[package]
name = "thurbox"
# Development version marker: real version injected at build time from git tags
version = "0.0.0-dev"
edition = "2021"
# Build script injects version from THURBOX_RELEASE_VERSION env variable (set by CI)
# Fallback to version above for local development builds
build = "build.rs"
# `cargo run` (no --bin) launches the TUI; thurbox-cli is the headless binary.
default-run = "thurbox"
authors = ["LeTuR <magicletur@protonmail.com>"]
license = "MIT"
description = "A TUI for orchestrating multiple coding-agent CLI sessions in persistent tmux panels"
repository = "https://github.com/Thurbeen/thurbox"
keywords = ["tui", "agent", "tmux", "git", "cli"]
categories = ["command-line-utilities"]
# Floor for the default feature set, which now carries the plugin host: `mlua`
# declares 1.88, above `ratatui 0.30`'s 1.86, so the runtime's floor *is* the
# crate's floor. Cargo cannot express a per-feature MSRV, and with `plugins`
# in `default` it no longer needs to.
rust-version = "1.88"

# v2 plugin host, in the default feature set since Stage B (ADR-40): the Luau VM
# is part of every build a user installs, because a bundled pane is a Luau
# program and a pane no released binary can draw is not a pane. Building it needs
# a C++ toolchain for mlua's vendored Luau sources on every release target.
[features]
default = ["plugins"]
plugins = ["dep:mlua"]

[dependencies]
# TUI framework
# `unstable-rendered-line-info` exposes `Paragraph::line_count`, the only way to
# ask ratatui how many rows its own word-wrapper will produce. The view tree's
# `paragraph` node needs that number *before* it paints, so a wrapped node does
# not overdraw its next sibling — see `docs/ARCHITECTURE.md` ADR-26.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
tui-term = "0.3"

# Terminal emulation
vt100 = "0.16"

# Display-width math for clickable-link column positions (wide CJK/emoji cells)
unicode-width = "0.2"

# Markdown parsing (task description rendering)
pulldown-cmark = { version = "0.13", default-features = false }

# Base64 payload framing for the Windows-host remote file copy (already in the
# dependency tree transitively; pinned to the same resolved version)
base64 = "0.22"

# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "net"] }

# Session management
uuid = { version = "1", features = ["v4", "serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Configuration
serde = { version = "1", features = ["derive"] }
toml = "1.0"
toml_edit = "0.25"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }

# System metrics
sysinfo = "0.39"

# Error handling
anyhow = "1.0"

# Clipboard (text only — the default `image-data` feature pulls in the
# image/png/moxcms decoding stack we never use; thurbox only copies/pastes text)
arboard = { version = "3", default-features = false }

# Temporary directories (used by tests and session_ops)
tempfile = "3"

# JSON (session metadata, keybindings, agent config)
serde_json = "1"

# CLI argument parsing (thurbox-cli)
clap = { version = "4", features = ["derive"] }

# Luau runtime for the v2 plugin host (`plugins` feature). `send` is
# deliberately NOT enabled: leaving `Lua` as `!Send` makes "a VM is only ever
# touched by its owning thread" a compile error rather than a review rule, which
# is what keeps plugin execution off the render loop.
mlua = { version = "0.12", features = ["luau", "vendored"], optional = true }

# Date/time + cron scheduling (automations)
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
cron = "0.17"
serde_ignored = "0.1.14"

# OS notifications. Linux-only: dbus with action callbacks (click-to-focus
# works). macOS dispatches via `terminal-notifier` if installed, else the
# system `osascript` binary — both inside `src/notifications.rs`, neither
# needs notify-rust. notify-rust's macOS backend (`mac-notification-sys`)
# rides the deprecated `NSUserNotificationCenter` API and is non-functional
# for unbundled CLIs on macOS 12+, so it isn't pulled in there. Windows
# (WSL toast) shells out to `powershell.exe`, also no notify-rust.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[[bin]]
name = "thurbox-cli"
path = "src/bin/thurbox-cli.rs"

# Development tool requirements (install with `cargo binstall` or `cargo install`)
[package.metadata.dev-tools]
prek = "0.2.0"
cocogitto = "6.2.0"
cargo-nextest = "0.9.0"
cargo-deny = "0.16.0"
cargo-audit = "0.21.0"
rumdl = "0.1.19"

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false

[dev-dependencies]
# Snapshot assertions for the TUI acceptance tests (src/app/acceptance.rs).
# default-features off keeps the dep tree minimal (just `similar`).
insta = { version = "1.48.0", default-features = false }

# Property/fuzz testing — proves thurbox's terminal pipeline is byte- and
# render-transparent (control_mode transport + terminal_view rendering). Runs in
# render-transparent (control_mode transport + terminal_view rendering). Runs in
# the normal `cargo nextest --all`.
proptest = "1"
