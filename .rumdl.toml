[global]
# `.claude`, `.pi` and `.opencode` are agent-tool scaffolding we do not author.
# `openspec/` is owned by the OpenSpec CLI: its artifacts start at `##` by
# template (the delta parser keys on `## ADDED Requirements` / `### Requirement:`
# headings, so an inserted H1 would change how a change archives), and
# `openspec validate --strict` is what checks them.
exclude = [".git", ".claude", ".pi", ".opencode", "openspec"]

[MD013]
line_length = 100
# Allow longer lines in tables and code blocks
tables = false
code_blocks = false

[MD033]
# Allow the HTML used for the README feature-wall layout
allowed_elements = ["table", "tr", "td", "img", "picture", "source", "a", "br", "div"]
