# Minimum supported Rust version. Mirrors `rust-version` in Cargo.toml — the
# floor is set by ratatui 0.30 (1.86), not by thurbox's own code. The `plugins`
# feature needs 1.88 on top of this.
msrv = "1.86"

# Lint configuration
avoid-breaking-exported-api = false
disallowed-names = ["foo", "bar", "baz"]
too-many-arguments-threshold = 7
type-complexity-threshold = 250
single-char-binding-names-threshold = 4

# Documentation
missing-docs-in-crate-items = false
