# Minimum supported Rust version. Mirrors `rust-version` in Cargo.toml — the
# floor is set by mlua (1.88), which the default feature set carries since the
# plugin host joined it, not by thurbox's own code.
msrv = "1.88"

# Lint configuration
avoid-breaking-exported-api = false
disallowed-names = ["foo", "bar", "baz"]
too-many-arguments-threshold = 7
type-complexity-threshold = 250
single-char-binding-names-threshold = 4

# Documentation
missing-docs-in-crate-items = false
